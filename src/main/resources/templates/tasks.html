<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Todo App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --success: #059669;
            --success-light: #ecfdf5;
            --danger: #dc2626;
            --danger-light: #fef2f2;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --border: #e2e8f0;
            --border-hover: #cbd5e1;
            --text: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --radius: 14px;
            --radius-sm: 10px;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 24px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 20px 60px rgba(15, 23, 42, 0.12);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            background-color: #f1f5f9;
            background-image:
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.08) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.06) 0, transparent 50%);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Layout ── */
        .page {
            max-width: 720px;
            margin: 0 auto;
            padding: 2.5rem 1.25rem 3rem;
        }

        /* ── Top bar ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
        }

        .brand-icon svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .brand-text h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .brand-text span {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .topbar-clock {
            text-align: right;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.55rem 1rem;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
            min-width: 200px;
        }

        .clock-date {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            margin-bottom: 0.15rem;
        }

        .clock-time {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
        }

        .clock-remaining {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--primary);
            margin-top: 0.25rem;
            font-variant-numeric: tabular-nums;
        }

        /* ── Stats row ── */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem 1.1rem;
            box-shadow: var(--shadow-sm);
        }

        .stat-label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text);
            line-height: 1;
        }

        .stat-card.accent .stat-value { color: var(--primary); }
        .stat-card.success .stat-value { color: var(--success); }

        /* ── Progress ── */
        .progress-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.65rem;
        }

        .progress-header span {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .progress-header strong {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--primary);
        }

        .progress-track {
            height: 6px;
            background: var(--border);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #818cf8);
            border-radius: 999px;
            transition: width 0.4s ease;
        }

        /* ── Main card ── */
        .main-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) + 2px);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .card-section {
            padding: 1.5rem 1.5rem 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .card-section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 1rem;
            letter-spacing: -0.01em;
        }

        /* ── Add form ── */
        .add-form {
            display: flex;
            gap: 0.65rem;
        }

        .input-wrap {
            flex: 1;
            position: relative;
        }

        .input-wrap svg {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .add-form input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text);
            background: var(--surface-2);
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .add-form input::placeholder {
            color: var(--text-muted);
        }

        .add-form input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .btn-add {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.75rem 1.2rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }

        .btn-add svg {
            width: 16px;
            height: 16px;
        }

        .btn-add:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        /* ── Task list ── */
        .task-list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.85rem;
        }

        .task-list-header h2 {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .badge-count {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.85rem 1rem;
            background: var(--surface-2);
            border: 1.5px solid transparent;
            border-radius: var(--radius-sm);
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
            animation: fadeIn 0.3s ease both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .task-item:hover {
            background: var(--surface);
            border-color: var(--border);
            box-shadow: var(--shadow-sm);
        }

        .task-item.completed {
            background: var(--success-light);
            border-color: #a7f3d0;
        }

        .task-item.completed:hover {
            border-color: #6ee7b7;
        }

        /* Checkbox indicator */
        .task-check {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--border-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            text-decoration: none;
        }

        .task-check svg {
            width: 12px;
            height: 12px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s;
        }

        .task-item.completed .task-check {
            background: var(--success);
            border-color: var(--success);
        }

        .task-item.completed .task-check svg {
            opacity: 1;
            transform: scale(1);
            stroke: white;
        }

        .task-check:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .task-item.completed .task-check:hover {
            background: #047857;
            border-color: #047857;
        }

        .task-body {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
            word-break: break-word;
            transition: color 0.2s;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-status {
            display: inline-block;
            margin-top: 0.2rem;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.1rem 0.45rem;
            border-radius: 4px;
        }

        .status-pending {
            color: #b45309;
            background: #fef3c7;
        }

        .status-done {
            color: var(--success);
            background: #d1fae5;
        }

        .task-actions {
            display: flex;
            gap: 0.35rem;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .task-item:hover .task-actions {
            opacity: 1;
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.15s;
            cursor: pointer;
        }

        .btn-icon svg {
            width: 15px;
            height: 15px;
        }

        .btn-icon.toggle:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-icon.delete:hover {
            background: var(--danger-light);
            border-color: #fca5a5;
            color: var(--danger);
        }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            background: var(--primary-light);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.1rem;
        }

        .empty-icon svg {
            width: 28px;
            height: 28px;
            color: var(--primary);
        }

        .empty-state h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.35rem;
        }

        .empty-state p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            margin-top: 1.75rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ── Responsive ── */
        @media (max-width: 560px) {
            .page { padding: 1.5rem 1rem 2.5rem; }

            .stats { grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }
            .stat-card { padding: 0.75rem; }
            .stat-value { font-size: 1.3rem; }

            .topbar-clock {
                min-width: unset;
                padding: 0.45rem 0.75rem;
            }

            .clock-time { font-size: 1rem; }

            .add-form { flex-direction: column; }
            .btn-add { justify-content: center; }

            .task-actions { opacity: 1; }

            .card-section { padding: 1.15rem; }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- Top bar -->
    <div class="topbar">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
            </div>
            <div class="brand-text">
                <h1>TaskFlow</h1>
                <span>Productivity Dashboard</span>
            </div>
        </div>
        <div class="topbar-clock">
            <div class="clock-date" id="liveDate">Loading…</div>
            <div class="clock-time" id="liveTime">--:--:--</div>
            <div class="clock-remaining" id="timeLeft">-- left today</div>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats" th:with="total=${#lists.size(tasks)}, done=${#lists.size(tasks.?[completed])}, pending=${#lists.size(tasks.?[completed == false])}">
        <div class="stat-card accent">
            <div class="stat-label">Total</div>
            <div class="stat-value" th:text="${total}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Pending</div>
            <div class="stat-value" th:text="${pending}">0</div>
        </div>
        <div class="stat-card success">
            <div class="stat-label">Completed</div>
            <div class="stat-value" th:text="${done}">0</div>
        </div>
    </div>

    <!-- Progress bar -->
    <div class="progress-section" th:with="total=${#lists.size(tasks)}, done=${#lists.size(tasks.?[completed])}, pct=${total > 0 ? (done * 100 / total) : 0}">
        <div class="progress-header">
            <span>Overall Progress</span>
            <strong th:text="${pct} + '%'">0%</strong>
        </div>
        <div class="progress-track">
            <div class="progress-fill" th:style="'width:' + ${pct} + '%'"></div>
        </div>
    </div>

    <!-- Main card -->
    <div class="main-card">

        <!-- Add task -->
        <div class="card-section">
            <div class="section-title">Create New Task</div>
            <form action="/tasks" method="POST" class="add-form">
                <div class="input-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" name="title" placeholder="What needs to be done?" required>
                </div>
                <button type="submit" class="btn-add">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Add Task
                </button>
            </form>
        </div>

        <!-- Task list -->
        <div class="card-section">

            <div th:if="${#lists.isEmpty(tasks)}" class="empty-state">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg>
                </div>
                <h3>All clear!</h3>
                <p>No tasks yet. Create your first one above to get started.</p>
            </div>

            <div th:unless="${#lists.isEmpty(tasks)}">
                <div class="task-list-header">
                    <h2>Your Tasks</h2>
                    <span class="badge-count" th:text="${#lists.size(tasks)} + ' items'">0 items</span>
                </div>

                <div class="task-list">
                    <div th:each="task : ${tasks}"
                         th:class="${task.completed} ? 'task-item completed' : 'task-item'">

                        <a th:href="@{/tasks/{id}/toggle(id=${task.id})}" class="task-check" title="Mark complete">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </a>

                        <div class="task-body">
                            <div class="task-title" th:text="${task.title}">Task title</div>
                            <span th:class="${task.completed} ? 'task-status status-done' : 'task-status status-pending'"
                                  th:text="${task.completed} ? 'Completed' : 'Pending'">Pending</span>
                        </div>

                        <div class="task-actions">
                            <a th:href="@{/tasks/{id}/toggle(id=${task.id})}"
                               class="btn-icon toggle" title="Toggle status">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                                    <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                                </svg>
                            </a>
                            <a th:href="@{/tasks/{id}/delete(id=${task.id})}"
                               class="btn-icon delete" title="Delete task">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                                    <path d="M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                                </svg>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="footer">TaskFlow &mdash; Built with Spring Boot</div>

</div>

<script>
    function updateClock() {
        const now = new Date();

        document.getElementById('liveDate').textContent = now.toLocaleDateString(undefined, {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        document.getElementById('liveTime').textContent = now.toLocaleTimeString(undefined, {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: true
        });

        const midnight = new Date(now);
        midnight.setHours(24, 0, 0, 0);
        const remaining = midnight - now;
        const hours   = Math.floor(remaining / 3600000);
        const minutes = Math.floor((remaining % 3600000) / 60000);
        const seconds = Math.floor((remaining % 60000) / 1000);

        document.getElementById('timeLeft').textContent =
            hours + 'h ' + minutes + 'm ' + seconds + 's left today';
    }

    updateClock();
    setInterval(updateClock, 1000);
</script>

</body>
</html>
